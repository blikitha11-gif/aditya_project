    <!-- JAVASCRIPT -->
    <script>

        document.getElementById("applicationForm")
        .addEventListener("submit", function(event) {


            let phone = document.querySelector('input[type="tel"]').value;
            if(phone.length !== 10){
                 alert("Phone number must be 10 digits");
                 return;
            }
            alert("Application Submitted Successfully!");
            window.location.href = "t.html";
            });

            let inputs = document.querySelectorAll("input");
            let button = document.getElementById("submitBtn");

            inputs.forEach(input => {
                input.addEventListener("input", function(){
                    let allFilled = true;
                    inputs.forEach(i => {
                        if(i.value === ""){
                            allFilled = false;
                        }
                    });
                    button.disabled = !allFilled;
                });
            });


            // In JavaScript, a dynamic dropdown is a select menu whose options are generated, updated, 
            // or filtered while the user is on the page, rather
            //  than being hard-coded in the original HTM

        let courseSelect =
        document.getElementById("courseSelect");
    
        let branchSelect =
        document.getElementById("branchSelect");
    
        courseSelect.addEventListener("change", function(){
    
            let selectedCourse =
            courseSelect.value;
    
            branchSelect.innerHTML =
            `<option value="">
                Select Specialization
            </option>`;
    
            // B.Tech
            if(selectedCourse === "B.Tech"){
    
                let branches = [
                    "CSE",
                    "ECE",
                    "EEE",
                    "Mechanical",
                    "Civil",
                    "AI & Data Science"
                ];
    
                branches.forEach(function(branch){
    
                    branchSelect.innerHTML +=
                    `<option>${branch}</option>`;
    
                });
    
            }
    
            // MBA
            else if(selectedCourse === "MBA"){
    
                let branches = [
                    "Finance",
                    "Marketing",
                    "Human Resource",
                    "Business Analytics"
                ];
    
                branches.forEach(function(branch){
    
                    branchSelect.innerHTML +=
                    `<option>${branch}</option>`;
    
                });
    
            }
    
            // Degree
            else if(selectedCourse === "Degree"){
    
                let branches = [
                    "BCA",
                    "BBA",
                    "B.Com",
                    "B.Sc Computer Science"
                ];
    
                branches.forEach(function(branch){
    
                    branchSelect.innerHTML +=
                    `<option>${branch}</option>`;
    
                });
    
            }
    
            // Diploma
            else if(selectedCourse === "Diploma"){
    
                let branches = [
                    "Civil",
                    "Mechanical",
                    "Computer Engineering",
                    "Electronics"
                ];
    
                branches.forEach(function(branch){
    
                    branchSelect.innerHTML +=
                    `<option>${branch}</option>`;
    
                });
    
            }
    
        });
    
    </script>
